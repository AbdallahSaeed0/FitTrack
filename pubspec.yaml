name: fittrack
description: FitTrack - Your Personal Fitness Companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # HTTP Client
  dio: ^5.4.3

  # Charts
  fl_chart: ^0.68.0

  # PDF Export
  pdf: ^3.10.8
  printing: ^5.13.0

  # Image Caching
  cached_network_image: ^3.3.1

  # Haptic + Vibration
  vibration: ^2.0.0

  # UI Helpers
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  table_calendar: ^3.0.9
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.2.4
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#38BDF8"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#38BDF8"
  image: assets/icons/splash_icon.png
  android: true
  ios: true
  android_12:
    color: "#38BDF8"
    image: assets/icons/splash_icon.png
    icon_background_color: "#38BDF8"

flutter:
  uses-material-design: true

  assets:
    - assets/data/exercises.json
    - assets/data/usda_foods.json
    - assets/data/openfoodfacts.json
    - assets/images/
    - assets/icons/
